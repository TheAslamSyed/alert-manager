global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: warroom-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - democorp-bank:8090
          - api-gateway:8080
          - ingestion-service:8081
          - incident-service:8082
          - agent-service:8083
          - knowledge-service:8084
          - remediation-service:8085
          - audit-service:8086
