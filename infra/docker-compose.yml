# War Room Agent - local stack
#
#   Infrastructure only:   docker compose -f infra/docker-compose.yml up -d
#   Infrastructure + apps: docker compose -f infra/docker-compose.yml --profile apps up -d --build
#   (Java is compiled inside Docker - see Dockerfile.service)
#
# Ollama runs on the host (http://localhost:11434); containers reach it via host.docker.internal.
# All passwords below are local development defaults - override them in infra/.env.

name: war-room

x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: docker
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/democorp
  KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/democorp/protocol/openid-connect/certs
  ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
  LOKI_URL: http://loki:3100/loki/api/v1/push
  DB_URL_BASE: jdbc:postgresql://postgres:5432/warroom
  JAVA_TOOL_OPTIONS: -Xms128m -Xmx320m

x-app: &app
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    kafka:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  # ---------------------------------------------------------------- infrastructure
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      # Host port 5433 (5432 is often taken by a local Postgres). Containers still use postgres:5432.
      - "5433:5432"
    environment:
      POSTGRES_DB: warroom
      POSTGRES_USER: warroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warroom}
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warroom -d warroom"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Tokens always carry this issuer, even when services fetch keys via http://keycloak:8080
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-democorp.json:/opt/keycloak/data/import/realm-democorp.json:ro

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alertmanager:
    image: prom/alertmanager:v0.28.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager:/etc/alertmanager:ro

  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "9411:9411"

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - zipkin

  # ---------------------------------------------------------------- applications
  democorp-bank:
    <<: *app
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: Dockerfile.service
      args:
        MODULE: democorp-bank
    ports:
      - "8090:8090"
    depends_on: []
    environment:
      <<: *app-env
      INGEST_URL: http://ingestion-service:8081
      INCIDENT_URL: http://incident-service:8082
      KNOWLEDGE_URL: http://knowledge-service:8084
      INGEST_API_KEY: ${INGEST_API_KEY:-dev-ingest-key}
      DEMOCORP_ADMIN_KEY: ${DEMOCORP_ADMIN_KEY:-dev-admin-key}

  ingestion-service:
    <<: *app
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: Dockerfile.service
      args:
        MODULE: ingestion-service
    ports:
      - "8081:8081"
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://postgres:5432/warroom?currentSchema=ingestion
      DB_USER: ingestion
      DB_PASSWORD: ${INGESTION_DB_PASSWORD:-ingestion}
      INGEST_API_KEY: ${INGEST_API_KEY:-dev-ingest-key}

  incident-service:
    <<: *app
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: Dockerfile.service
      args:
        MODULE: incident-service
    ports:
      - "8082:8082"
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://postgres:5432/warroom?currentSchema=incident
      DB_USER: incident
      DB_PASSWORD: ${INCIDENT_DB_PASSWORD:-incident}

  knowledge-service:
    <<: *app
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: Dockerfile.service
      args:
        MODULE: knowledge-service
    ports:
      - "8084:8084"
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://postgres:5432/warroom?currentSchema=knowledge,public
      DB_USER: knowledge
      DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD:-knowledge}
      OLLAMA_BASE_URL: http://host.docker.internal:11434

  agent-service:
    <<: *app
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: Dockerfile.service
      args:
        MODULE: agent-service
    ports:
      - "8083:8083"
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://postgres:5432/warroom?currentSchema=agent
      DB_USER: agent
      DB_PASSWORD: ${AGENT_DB_PASSWORD:-agent}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL_QUERY: http://loki:3100
      KNOWLEDGE_URL: http://knowledge-service:8084

  remediation-service:
    <<: *app
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: Dockerfile.service
      args:
        MODULE: remediation-service
    ports:
      - "8085:8085"
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://postgres:5432/warroom?currentSchema=remediation
      DB_USER: remediation
      DB_PASSWORD: ${REMEDIATION_DB_PASSWORD:-remediation}
      DEMOCORP_URL: http://democorp-bank:8090
      DEMOCORP_ADMIN_KEY: ${DEMOCORP_ADMIN_KEY:-dev-admin-key}
      PROMETHEUS_URL: http://prometheus:9090
      APPROVAL_SIGNING_KEY: ${APPROVAL_SIGNING_KEY:-dev-approval-signing-key-change-me}

  audit-service:
    <<: *app
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: Dockerfile.service
      args:
        MODULE: audit-service
    ports:
      - "8086:8086"
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://postgres:5432/warroom?currentSchema=audit
      DB_USER: audit
      DB_PASSWORD: ${AUDIT_DB_PASSWORD:-audit}

  api-gateway:
    <<: *app
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: Dockerfile.service
      args:
        MODULE: api-gateway
    ports:
      - "8080:8080"
    depends_on: []
    environment:
      <<: *app-env
      INCIDENT_URL: http://incident-service:8082
      REMEDIATION_URL: http://remediation-service:8085
      KNOWLEDGE_URL: http://knowledge-service:8084
      AUDIT_URL: http://audit-service:8086
      DEMOCORP_URL: http://democorp-bank:8090

  frontend:
    profiles: ["apps"]
    build: ../frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - api-gateway

volumes:
  pgdata:
