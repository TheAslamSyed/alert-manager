spring:
  application:
    name: incident-service
  config:
    import: classpath:warroom-common.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/warroom?currentSchema=incident}
    username: ${DB_USER:incident}
    password: ${DB_PASSWORD:incident}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

server:
  port: 8082

warroom:
  security:
    # /internal/** is only reachable inside the Docker network (the gateway does not route it).
    public-paths: ["/internal/**"]
  correlation:
    # Open incidents updated within this window are candidates for new signals
    window: 15m
    # Deploys / config changes / tickets this recent are attached when an incident opens
    context-lookback: 30m
    attach-threshold: 0.6
