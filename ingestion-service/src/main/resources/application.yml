spring:
  application:
    name: ingestion-service
  config:
    import: classpath:warroom-common.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/warroom?currentSchema=ingestion}
    username: ${DB_USER:ingestion}
    password: ${DB_PASSWORD:ingestion}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

server:
  port: 8081

warroom:
  security:
    # Webhooks authenticate with an API key (see ApiKeyFilter), not a user JWT.
    public-paths: ["/ingest/**"]
  ingest:
    api-key: ${INGEST_API_KEY:dev-ingest-key}
    dedup-window: 10m
